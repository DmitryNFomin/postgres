# Pinned sources for the v11 bare-metal benchmark kit.
#
# This is the ONE place the three commit hashes live (brief-v11-wpc-kit.md,
# "Launch note"). Every script that needs a hash reads it from here via
# sources_conf.py (or, for bash, by sourcing this file directly -- the
# syntax below is plain KEY=VALUE and is valid in both).
#
# The launcher (run-benchmark.sh) refuses to run while any placeholder
# below (a bare <...> token) remains. The coordinator fills these in,
# then runs make-baremetal-package.sh for real.
MASTER_SHA=311df1dc0392f06973cf98eac51d63cb007267ce
V11_SHA=96c24a28006fb6ff66264998c698f5230d32ad26
CONTROL_SHA=f25ba2b70d349653f831c33c90fe4f14e12fd8ae

# Repository the three commits above live in.
POSTGRES_REPO_URL=https://github.com/DmitryNFomin/postgres.git

# Standalone patches carried in the package (referenced by glob, per the
# launch note, since the exact five v11-series filenames may be
# regenerated before packaging).
CONTROL_PATCH_GLOB=patches-control/0001-*.patch
V11_PATCH_GLOB=patches-v11/v11-*.patch

# The test_wait_primitive fixture (W1) is carried as a source snapshot
# taken with `git show` from this branch; the kit never checks this
# branch out anywhere, on this machine or on the benchmark host.
FIXTURE_BRANCH=fork/bench-v8-baseline
FIXTURE_PATH=src/test/modules/test_wait_primitive

# Names fixed by the v11 module series (brief-v11-wpc-kit.md, "Launch
# note"); not expected to change, but centralized here rather than
# scattered across scripts.
MODULE_NAME=pg_wait_event_tracing
HOOKS_INSTALLED_FUNCTION=pg_wait_event_tracing_hooks_installed
